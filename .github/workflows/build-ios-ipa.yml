name: Build local reader IPA (unsigned)

# push 到 main 自动构建；也可在 Actions 页面手动触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Flutter iOS IPA (no codesign)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Resolve dependencies and generate localizations
        run: |
          set -euo pipefail
          # 严格按 lockfile 解析（与仓库 public-source.yml 一致）；个别情况下回退到普通解析保证构建不中断
          flutter pub get --enforce-lockfile || flutter pub get
          flutter gen-l10n

      - name: Static analysis gate
        run: flutter analyze --no-pub

      # Flutter 3.44 起 `build ipa --no-codesign` 只产出 xcarchive 并跳过 IPA 导出，
      # 因此改为构建未签名 .app 后按 Payload/ 结构手动打包；
      # IPA 本质是包含 Payload/Runner.app 的 zip，Sideloadly/AltStore 安装时会重新签名。
      - name: Build unsigned release app
        run: flutter build ios --release --no-codesign --no-pub

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf Payload dist
          mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry dist/origo-x-local-reader.ipa Payload
          ls -lh dist/
          unzip -l dist/origo-x-local-reader.ipa | head -5

      - name: Upload IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: origo-x-local-reader-ipa
          path: dist/origo-x-local-reader.ipa
          if-no-files-found: error
          retention-days: 14

      # 发布到固定 tag 的 Release：公开仓库的 Release 资产可匿名下载，
      # 便于自动化交付（无需 token）。release 正文注明来源 commit 与 run 链接。
      - name: Publish IPA to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=ipa-latest
          SHA_SHORT=$(git rev-parse --short HEAD)
          NOTES=$(printf '本地阅读 IPA（未签名，Sideloadly 签名后安装）。\n\ncommit: %s\nrun: %s/%s/actions/runs/%s' "$SHA_SHORT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "IPA 构建 ($SHA_SHORT)" --notes "$NOTES"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/origo-x-local-reader.ipa
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "IPA 构建 ($SHA_SHORT)" --notes "$NOTES" dist/origo-x-local-reader.ipa
          fi
          echo "Published: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
